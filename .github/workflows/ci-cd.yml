name: Student Skill Exchange CI/CD

on:
  push:
    branches:
      - main
      - feature/ci-cd-pipeline

  pull_request:
    branches:
      - main

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build and Smoke Test
    needs: lint-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t student-skill-exchange .

      - name: Run Docker container
        run: |
          docker run -d \
            -p 3000:3000 \
            --name skill-exchange \
            student-skill-exchange

      - name: Wait for application
        run: sleep 5

      - name: Health check
        run: curl -f http://localhost:3000/health

      - name: Stop container
        if: always()
        run: docker stop skill-exchange || true

   deploy:
    name: Deploy to Render
    needs: docker-build
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-latest

    steps:
      - name: Intentional deployment failure
        run: |
          echo "Intentional failure for CI/CD demonstration"
          exit 1git add .github/workflows/ci-cd.yml